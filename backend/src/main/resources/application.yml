server:
  port: 8080

spring:
  application:
    name: portfolio-manager
  # Default database: H2 file-based mode, persisted under backend/data so holdings
  # survive app restarts (including Spring Boot DevTools' auto-restart-on-recompile).
  # To switch to local MySQL, change driver and url below, or run with profile:
  # mvn spring-boot:run -Dspring-boot.run.profiles=mysql
  datasource:
    url: jdbc:h2:file:./data/portfoliodb;AUTO_SERVER=TRUE;MODE=MySQL
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

portfolio:
  market-data:
    ttl-minutes: 5
    refresh-ms: 300000
    curl-fallback: true
    yfinance-fallback: true
    yfinance-script: scripts/fetch_yahoo_quote.py
    cached-price-url: https://c4rm9elh30.execute-api.us-east-1.amazonaws.com/default/cachedPriceData

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
